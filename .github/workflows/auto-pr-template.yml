name: Set PR template by target branch

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  set-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick and apply template based on base branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const baseBranch = context.payload.pull_request.base.ref;
            const currentBody = context.payload.pull_request.body || '';

            // só aplica se a PR ainda não tem descrição (evita sobrescrever o que a pessoa já escreveu)
            if (currentBody.trim().length > 0) {
              console.log('PR já tem descrição, não vou sobrescrever.');
              return;
            }

            const templateMap = {
              'main': '.github/PULL_REQUEST_TEMPLATE/main.md',
            };

            const templatePath = templateMap[baseBranch] || '.github/PULL_REQUEST_TEMPLATE/develop.md';
            const body = fs.readFileSync(templatePath, 'utf8');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: body,
            });
